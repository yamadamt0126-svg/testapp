<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カレンダー日程調整</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        discord: {
                            blurple: '#5865F2',
                            green: '#57F287',
                            yellow: '#FEE75C',
                            red: '#ED4245',
                            bg: '#313338',
                            sidebar: '#2B2D31',
                            card: '#1E1F22',
                            hover: '#35373C',
                            active: '#3F4248',
                            text: '#DBDEE1',
                            muted: '#949BA4',
                            border: '#3F4147'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #313338;
            color: #DBDEE1;
            font-family: 'Inter', sans-serif;
            user-select: none;
        }
        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #2B2D31;
        }
        ::-webkit-scrollbar-thumb {
            background: #1A1B1E;
            border-radius: 3px;
        }
        /* Custom calendar transitions */
        .calendar-day-btn {
            transition: all 0.15s ease-in-out;
        }
        .calendar-day-btn:active {
            transform: scale(0.96);
        }
        .best-day-glow {
            box-shadow: 0 0 15px rgba(254, 231, 92, 0.35);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased selection:bg-discord-blurple selection:text-white">

    <!-- Header Navigation -->
    <header class="bg-discord-sidebar border-b border-discord-border px-4 py-3 sticky top-0 z-30 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-discord-blurple flex items-center justify-center text-white text-xl shadow-md">
                    <i class="fa-solid fa-calendar-days"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-white leading-tight">カレンダー日程調整</h1>
                    <p class="text-xs text-discord-muted">午前・午後をタップして「◯」で参加可能日を登録</p>
                </div>
            </div>

            <button onclick="openResetModal()" class="text-xs text-discord-muted hover:text-discord-red border border-discord-border hover:border-discord-red/50 bg-discord-card hover:bg-discord-red/10 px-3 py-1.5 rounded-lg transition flex items-center gap-1.5">
                <i class="fa-solid fa-rotate-left"></i>
                <span>リセット</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-5xl w-full mx-auto p-3 sm:p-6 space-y-5">

        <!-- Active Respondent Selection & Add Card -->
        <section class="bg-discord-sidebar border border-discord-border rounded-xl p-4 sm:p-5 shadow-lg space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-discord-border pb-3">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-user-check text-discord-blurple text-lg"></i>
                    <div>
                        <h2 class="text-sm font-bold text-white tracking-wider">回答者の選択・追加</h2>
                        <p class="text-xs text-discord-muted">名前を選んでカレンダーの「午前」「午後」をタップしてください</p>
                    </div>
                </div>
                <span id="total-respondents-badge" class="text-xs bg-discord-card border border-discord-border px-2.5 py-1 rounded-md text-discord-muted font-medium self-start sm:self-auto">
                    参加メンバー: 0名
                </span>
            </div>

            <!-- Participant Pills + Add New Input -->
            <div class="flex flex-col md:flex-row gap-3 justify-between items-stretch md:items-center">
                <!-- Participant Selector Pills -->
                <div id="participant-pills" class="flex flex-wrap items-center gap-2">
                    <!-- Dynamically populated -->
                </div>

                <!-- Add New Participant Form -->
                <form onsubmit="handleAddParticipant(event)" class="flex items-center gap-2 shrink-0">
                    <input type="text" id="new-participant-input" placeholder="新しい名前を追加..." maxlength="15"
                        class="w-full sm:w-44 bg-discord-card border border-discord-border rounded-lg px-3 py-1.5 text-xs text-white placeholder-discord-muted focus:outline-none focus:border-discord-blurple transition">
                    <button type="submit" class="bg-discord-blurple hover:bg-discord-blurple/90 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition flex items-center gap-1 whitespace-nowrap shadow">
                        <i class="fa-solid fa-plus"></i> 追加
                    </button>
                </form>
            </div>
        </section>

        <!-- Main Calendar Widget -->
        <section class="bg-discord-sidebar border border-discord-border rounded-xl p-3 sm:p-6 shadow-xl space-y-4">
            
            <!-- Calendar Navigation Header -->
            <div class="flex flex-wrap items-center justify-between gap-3">
                <div class="flex items-center gap-1.5 sm:gap-2">
                    <button onclick="changeMonth(-1)" class="px-2.5 py-1.5 rounded-lg border border-discord-border bg-discord-card hover:bg-discord-hover text-white text-xs font-semibold flex items-center gap-1 transition">
                        <i class="fa-solid fa-chevron-left"></i> 前月
                    </button>
                    <h2 id="calendar-month-label" class="text-base sm:text-xl font-extrabold text-white min-w-[125px] sm:min-w-[150px] text-center"></h2>
                    <button onclick="changeMonth(1)" class="px-2.5 py-1.5 rounded-lg border border-discord-border bg-discord-card hover:bg-discord-hover text-white text-xs font-semibold flex items-center gap-1 transition">
                        次月 <i class="fa-solid fa-chevron-right"></i>
                    </button>
                    <button onclick="goToToday()" class="ml-1 px-2.5 py-1.5 rounded-lg border border-discord-border bg-discord-card hover:bg-discord-hover text-discord-muted hover:text-white text-xs transition">
                        今月
                    </button>
                </div>

                <!-- Legend -->
                <div class="flex items-center gap-3 text-xs">
                    <span class="flex items-center gap-1.5 text-discord-green font-semibold">
                        <span class="w-4 h-4 rounded-full bg-discord-green text-gray-900 font-black inline-flex items-center justify-center text-[10px]">◯</span>
                        あなたの選択中
                    </span>
                    <span class="flex items-center gap-1.5 text-discord-yellow font-semibold">
                        <span class="px-1.5 py-0.5 rounded bg-discord-yellow text-gray-900 font-black text-[10px]">BEST</span>
                        最多投票枠
                    </span>
                </div>
            </div>

            <!-- Calendar Days Header (Sun - Sat) -->
            <div class="grid grid-cols-7 text-center border-b border-discord-border pb-2 text-xs font-bold tracking-wider text-discord-muted">
                <div class="text-discord-red">日</div>
                <div>月</div>
                <div>火</div>
                <div>水</div>
                <div>木</div>
                <div>金</div>
                <div class="text-discord-blurple">土</div>
            </div>

            <!-- Calendar Grid -->
            <div id="calendar-grid" class="grid grid-cols-7 gap-1 sm:gap-2">
                <!-- Days dynamically generated -->
            </div>
        </section>

        <!-- Top Candidate Slots & Member Summary -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <!-- Top Ranked Slots -->
            <section class="bg-discord-sidebar border border-discord-border rounded-xl p-4 sm:p-5 shadow-lg space-y-3">
                <div class="flex items-center justify-between border-b border-discord-border pb-2.5">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-crown text-discord-yellow text-base"></i>
                        <h3 class="text-sm font-bold text-white tracking-wider">この月の人気日程（上位）</h3>
                    </div>
                </div>
                <div id="top-slots-list" class="space-y-2">
                    <!-- Dynamically populated -->
                </div>
            </section>

            <!-- Member Breakdown List -->
            <section class="bg-discord-sidebar border border-discord-border rounded-xl p-4 sm:p-5 shadow-lg space-y-3">
                <div class="flex items-center justify-between border-b border-discord-border pb-2.5">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-users text-discord-green text-base"></i>
                        <h3 class="text-sm font-bold text-white tracking-wider">メンバー別 回答状況</h3>
                    </div>
                </div>
                <div id="respondents-summary-list" class="space-y-2 max-h-60 overflow-y-auto pr-1">
                    <!-- Respondent chips dynamically generated -->
                </div>
            </section>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-discord-sidebar border-t border-discord-border py-4 text-center text-xs text-discord-muted">
        <p>午前・午後 カレンダー日程調整</p>
    </footer>

    <!-- Custom Confirmation Modal (No native confirm/alert) -->
    <div id="confirm-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60 backdrop-blur-xs p-4">
        <div class="bg-discord-sidebar border border-discord-border rounded-xl max-w-sm w-full p-5 shadow-2xl space-y-4">
            <div class="flex items-center gap-2.5 text-white font-bold text-base">
                <i class="fa-solid fa-triangle-exclamation text-discord-yellow"></i>
                <span id="modal-title">確認</span>
            </div>
            <p id="modal-message" class="text-xs text-discord-text leading-relaxed"></p>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeConfirmModal()" class="px-3.5 py-1.5 rounded-lg bg-discord-card hover:bg-discord-hover text-xs text-discord-text border border-discord-border transition">
                    キャンセル
                </button>
                <button id="modal-confirm-btn" class="px-3.5 py-1.5 rounded-lg bg-discord-red hover:bg-discord-red/90 text-xs text-white font-bold transition">
                    実行する
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Application Script -->
    <script>
        // Data Structure
        // users: Array of { id: string, name: string, votes: { 'YYYY-MM-DD_am': true, 'YYYY-MM-DD_pm': true } }
        let appData = {
            users: [],
            currentUserId: null
        };

        let currentDate = new Date();
        const STORAGE_KEY = 'am_pm_circle_calendar_v1';

        window.onload = function() {
            loadStorageData();

            if (!appData.users || appData.users.length === 0) {
                seedInitialData();
            }

            if (!appData.currentUserId || !appData.users.some(u => u.id === appData.currentUserId)) {
                appData.currentUserId = appData.users[0].id;
            }

            renderAll();
        };

        function renderAll() {
            renderParticipantPills();
            renderCalendar();
            renderTopSlots();
            renderRespondentsSummary();
        }

        function loadStorageData() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    const parsed = JSON.parse(stored);
                    if (parsed && Array.isArray(parsed.users)) {
                        appData = parsed;
                    }
                }
            } catch (e) {
                console.error("Failed to load local storage", e);
            }
        }

        function saveStorageData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
            } catch (e) {
                console.error("Failed to save local storage", e);
            }
        }

        function seedInitialData() {
            const base = new Date();
            const y = base.getFullYear();
            const m = String(base.getMonth() + 1).padStart(2, '0');
            const daysInMonth = new Date(y, base.getMonth() + 1, 0).getDate();

            const safeDay = (offset) => {
                const d = Math.min(Math.max(base.getDate() + offset, 1), daysInMonth);
                return String(d).padStart(2, '0');
            };

            const d1 = `${y}-${m}-${safeDay(1)}`;
            const d2 = `${y}-${m}-${safeDay(2)}`;
            const d3 = `${y}-${m}-${safeDay(4)}`;

            appData.users = [
                {
                    id: 'usr_1',
                    name: '田中',
                    votes: {
                        [`${d1}_am`]: true,
                        [`${d1}_pm`]: true,
                        [`${d2}_pm`]: true,
                        [`${d3}_am`]: true
                    }
                },
                {
                    id: 'usr_2',
                    name: '佐藤',
                    votes: {
                        [`${d1}_pm`]: true,
                        [`${d2}_am`]: true,
                        [`${d2}_pm`]: true
                    }
                },
                {
                    id: 'usr_3',
                    name: '鈴木',
                    votes: {
                        [`${d1}_pm`]: true,
                        [`${d3}_am`]: true,
                        [`${d3}_pm`]: true
                    }
                }
            ];
            appData.currentUserId = 'usr_1';
            saveStorageData();
        }

        function getCurrentUser() {
            return appData.users.find(u => u.id === appData.currentUserId);
        }

        function switchUser(userId) {
            appData.currentUserId = userId;
            saveStorageData();
            renderAll();
        }

        function handleAddParticipant(event) {
            event.preventDefault();
            const input = document.getElementById('new-participant-input');
            const name = input.value.trim();
            if (!name) {
                showToast('名前を入力してください');
                return;
            }

            const newUser = {
                id: 'usr_' + Date.now(),
                name: name,
                votes: {}
            };
            appData.users.push(newUser);
            appData.currentUserId = newUser.id;
            input.value = '';
            saveStorageData();
            renderAll();
            showToast(`「${name}」を追加しました`);
        }

        function renderParticipantPills() {
            const container = document.getElementById('participant-pills');
            const badge = document.getElementById('total-respondents-badge');
            container.innerHTML = '';
            badge.textContent = `参加メンバー: ${appData.users.length}名`;

            appData.users.forEach(user => {
                const isActive = user.id === appData.currentUserId;
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.onclick = () => switchUser(user.id);
                btn.className = isActive
                    ? 'px-3.5 py-1.5 rounded-lg bg-discord-blurple text-white text-xs font-bold shadow-md flex items-center gap-1.5 ring-2 ring-discord-blurple/50 transition'
                    : 'px-3 py-1.5 rounded-lg bg-discord-card hover:bg-discord-hover text-discord-text border border-discord-border text-xs font-medium flex items-center gap-1.5 transition';

                btn.innerHTML = `
                    <span class="w-4 h-4 rounded-full ${isActive ? 'bg-white text-discord-blurple' : 'bg-discord-active text-white'} text-[10px] font-extrabold inline-flex items-center justify-center">
                        ${user.name.slice(0, 1)}
                    </span>
                    <span>${escapeHtml(user.name)}</span>
                `;
                container.appendChild(btn);
            });
        }

        // Toggle AM or PM '◯' vote for current user
        function toggleSlotVote(dateKey, period) {
            const user = getCurrentUser();
            if (!user) return;
            if (!user.votes) user.votes = {};

            const slotKey = `${dateKey}_${period}`;
            if (user.votes[slotKey]) {
                delete user.votes[slotKey];
            } else {
                user.votes[slotKey] = true;
            }

            saveStorageData();
            renderAll();
        }

        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            renderAll();
        }

        function goToToday() {
            currentDate = new Date();
            renderAll();
        }

        function getMonthSlotStats(year, month) {
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const monthStr = String(month + 1).padStart(2, '0');
            const slotStats = {};
            let maxCount = 0;

            for (let d = 1; d <= daysInMonth; d++) {
                const dayStr = String(d).padStart(2, '0');
                const dateKey = `${year}-${monthStr}-${dayStr}`;

                ['am', 'pm'].forEach(period => {
                    const slotKey = `${dateKey}_${period}`;
                    const voters = appData.users.filter(u => u.votes && u.votes[slotKey]).map(u => u.name);
                    slotStats[slotKey] = {
                        dateKey,
                        day: d,
                        period,
                        count: voters.length,
                        voters
                    };
                    if (voters.length > maxCount) {
                        maxCount = voters.length;
                    }
                });
            }

            return { slotStats, maxCount, daysInMonth };
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            document.getElementById('calendar-month-label').textContent = `${year}年 ${month + 1}月`;

            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';

            const firstDayOfWeek = new Date(year, month, 1).getDay();
            const { slotStats, maxCount, daysInMonth } = getMonthSlotStats(year, month);
            const currentUser = getCurrentUser();
            const today = new Date();
            const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;

            // Empty cells before 1st day
            for (let i = 0; i < firstDayOfWeek; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = "min-h-[104px] sm:min-h-[118px] rounded-xl bg-discord-card/25 border border-transparent";
                grid.appendChild(emptyCell);
            }

            // Day cells
            for (let d = 1; d <= daysInMonth; d++) {
                const dayOfWeek = (firstDayOfWeek + d - 1) % 7;
                const dayStr = String(d).padStart(2, '0');
                const monthStr = String(month + 1).padStart(2, '0');
                const dateKey = `${year}-${monthStr}-${dayStr}`;

                const amKey = `${dateKey}_am`;
                const pmKey = `${dateKey}_pm`;
                const amStat = slotStats[amKey];
                const pmStat = slotStats[pmKey];

                const isAmBest = maxCount > 0 && amStat.count === maxCount;
                const isPmBest = maxCount > 0 && pmStat.count === maxCount;
                const hasBest = isAmBest || isPmBest;

                const myAm = !!(currentUser && currentUser.votes && currentUser.votes[amKey]);
                const myPm = !!(currentUser && currentUser.votes && currentUser.votes[pmKey]);
                const isToday = isCurrentMonth && today.getDate() === d;

                let dayNumColor = 'text-white';
                if (dayOfWeek === 0) dayNumColor = 'text-discord-red';
                else if (dayOfWeek === 6) dayNumColor = 'text-discord-blurple';

                const cell = document.createElement('div');
                cell.className = `min-h-[104px] sm:min-h-[118px] rounded-xl bg-discord-card border ${hasBest ? 'border-discord-yellow/70 best-day-glow' : 'border-discord-border'} p-1.5 sm:p-2 flex flex-col justify-between gap-1.5 transition`;

                cell.innerHTML = `
                    <!-- Day Number Header -->
                    <div class="flex items-center justify-between px-0.5">
                        <span class="text-xs sm:text-sm font-extrabold ${dayNumColor} ${isToday ? 'underline decoration-discord-blurple decoration-2 underline-offset-2' : ''}">
                            ${d}
                        </span>
                        ${hasBest ? '<span class="text-[9px] font-black bg-discord-yellow text-gray-900 px-1.5 py-0.2 rounded leading-tight">BEST</span>' : ''}
                    </div>

                    <!-- AM & PM Interactive Buttons -->
                    <div class="flex flex-col gap-1.5 flex-1 justify-end">
                        ${renderSlotButton(dateKey, 'am', '午前', myAm, amStat, isAmBest)}
                        ${renderSlotButton(dateKey, 'pm', '午後', myPm, pmStat, isPmBest)}
                    </div>
                `;

                grid.appendChild(cell);
            }
        }

        function renderSlotButton(dateKey, period, label, isSelectedByMe, stat, isBest) {
            const titleText = stat.voters.length > 0
                ? `${label}: ${stat.voters.join('、')}`
                : `${label}: まだ回答がありません`;

            let btnStyle = 'bg-discord-sidebar hover:bg-discord-hover border-discord-border text-discord-muted';
            if (isSelectedByMe && isBest) {
                btnStyle = 'bg-discord-green/20 hover:bg-discord-green/30 border-discord-yellow text-white';
            } else if (isSelectedByMe) {
                btnStyle = 'bg-discord-green/20 hover:bg-discord-green/30 border-discord-green text-white';
            } else if (isBest) {
                btnStyle = 'bg-discord-yellow/10 hover:bg-discord-yellow/20 border-discord-yellow/60 text-discord-text';
            } else if (stat.count > 0) {
                btnStyle = 'bg-discord-sidebar hover:bg-discord-hover border-discord-border text-discord-text';
            }

            return `
                <button type="button"
                    onclick="toggleSlotVote('${dateKey}', '${period}')"
                    title="${escapeHtml(titleText)}"
                    class="calendar-day-btn w-full rounded-lg border px-1.5 py-1 sm:py-1.5 flex items-center justify-between text-[11px] sm:text-xs font-semibold ${btnStyle}">
                    <span class="flex items-center gap-1">
                        <span class="text-[10px] sm:text-[11px] opacity-90">${label}</span>
                    </span>
                    <span class="flex items-center gap-1">
                        ${isSelectedByMe
                            ? '<span class="w-4 h-4 rounded-full bg-discord-green text-gray-900 font-black inline-flex items-center justify-center text-[10px] shadow-xs">◯</span>'
                            : '<span class="w-4 h-4 rounded-full border border-discord-muted/40 inline-flex items-center justify-center text-[9px] text-transparent">◯</span>'
                        }
                        <span class="text-[10px] sm:text-[11px] font-bold ${stat.count > 0 ? (isBest ? 'text-discord-yellow' : 'text-discord-green') : 'text-discord-muted/60'} min-w-[14px] text-right">
                            ${stat.count}
                        </span>
                    </span>
                </button>
            `;
        }

        function renderTopSlots() {
            const container = document.getElementById('top-slots-list');
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const { slotStats } = getMonthSlotStats(year, month);
            const weekdays = ['日', '月', '火', '水', '木', '金', '土'];

            const ranked = Object.values(slotStats)
                .filter(s => s.count > 0)
                .sort((a, b) => {
                    if (b.count !== a.count) return b.count - a.count;
                    if (a.day !== b.day) return a.day - b.day;
                    return a.period === 'am' ? -1 : 1;
                })
                .slice(0, 5);

            if (ranked.length === 0) {
                container.innerHTML = `<p class="text-xs text-discord-muted py-4 text-center">この月の「◯」投票はまだありません</p>`;
                return;
            }

            const topCount = ranked[0].count;
            container.innerHTML = ranked.map(item => {
                const dow = weekdays[new Date(year, month, item.day).getDay()];
                const periodLabel = item.period === 'am' ? '午前' : '午後';
                const isBest = item.count === topCount;

                return `
                    <div class="flex items-center justify-between gap-2 p-2.5 rounded-lg bg-discord-card border ${isBest ? 'border-discord-yellow/60' : 'border-discord-border'} text-xs">
                        <div class="flex items-center gap-2 min-w-0">
                            ${isBest ? '<span class="text-[10px] font-black bg-discord-yellow text-gray-900 px-1.5 py-0.5 rounded shrink-0">BEST</span>' : ''}
                            <span class="font-bold text-white shrink-0">${month + 1}/${item.day}(${dow}) ${periodLabel}</span>
                            <span class="text-discord-muted truncate text-[11px]">${escapeHtml(item.voters.join(', '))}</span>
                        </div>
                        <span class="font-extrabold text-discord-green shrink-0 bg-discord-green/10 border border-discord-green/30 px-2 py-0.5 rounded">
                            ◯ ${item.count}人
                        </span>
                    </div>
                `;
            }).join('');
        }

        function renderRespondentsSummary() {
            const listContainer = document.getElementById('respondents-summary-list');
            listContainer.innerHTML = '';

            appData.users.forEach(u => {
                const isCurrent = u.id === appData.currentUserId;
                const voteCount = Object.keys(u.votes || {}).length;

                const card = document.createElement('div');
                card.className = `flex items-center justify-between p-2.5 rounded-lg border text-xs transition ${isCurrent ? 'bg-discord-blurple/15 border-discord-blurple' : 'bg-discord-card border-discord-border'}`;
                
                card.innerHTML = `
                    <div class="flex items-center gap-2.5 min-w-0">
                        <div class="w-7 h-7 rounded-full ${isCurrent ? 'bg-discord-blurple' : 'bg-discord-active'} flex items-center justify-center font-bold text-white text-xs shrink-0">
                            ${escapeHtml(u.name.substring(0, 1))}
                        </div>
                        <div class="truncate">
                            <span class="font-bold text-white">${escapeHtml(u.name)}</span>
                            ${isCurrent ? '<span class="text-[10px] text-discord-blurple ml-1 font-semibold">(選択中)</span>' : ''}
                            <span class="block text-[10px] text-discord-muted">◯をつけた枠数: ${voteCount}枠</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-1.5 shrink-0">
                        <button type="button" onclick="switchUser('${u.id}')" class="px-2.5 py-1 rounded bg-discord-hover hover:bg-discord-active text-white text-[11px] transition">
                            ${isCurrent ? '入力中' : '選択'}
                        </button>
                        ${appData.users.length > 1 ? `
                            <button type="button" onclick="openDeleteUserModal('${u.id}', '${escapeHtml(u.name)}')" title="削除" class="px-2 py-1 rounded text-discord-muted hover:text-discord-red transition">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        ` : ''}
                    </div>
                `;

                listContainer.appendChild(card);
            });
        }

        // Custom Modal Controls (Replaces native confirm)
        let pendingModalAction = null;

        function openConfirmModal(title, message, onConfirm) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-message').textContent = message;
            pendingModalAction = onConfirm;
            const modal = document.getElementById('confirm-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeConfirmModal() {
            const modal = document.getElementById('confirm-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            pendingModalAction = null;
        }

        document.getElementById('modal-confirm-btn').onclick = function() {
            if (typeof pendingModalAction === 'function') {
                pendingModalAction();
            }
            closeConfirmModal();
        };

        function openDeleteUserModal(userId, userName) {
            openConfirmModal(
                'メンバーの削除',
                `「${userName}」さんとその投票データを削除しますか？`,
                () => {
                    appData.users = appData.users.filter(u => u.id !== userId);
                    if (appData.currentUserId === userId) {
                        appData.currentUserId = appData.users[0].id;
                    }
                    saveStorageData();
                    renderAll();
                    showToast(`「${userName}」を削除しました`);
                }
            );
        }

        function openResetModal() {
            openConfirmModal(
                'データのリセット',
                'すべての投票データを初期状態にリセットしますか？',
                () => {
                    localStorage.removeItem(STORAGE_KEY);
                    appData = { users: [], currentUserId: null };
                    seedInitialData();
                    renderAll();
                    showToast('データをリセットしました');
                }
            );
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `pointer-events-auto bg-discord-card border border-discord-blurple text-white px-4 py-2.5 rounded-lg shadow-xl text-xs flex items-center gap-2 transition-all duration-300 transform translate-y-4 opacity-0`;
            toast.innerHTML = `<i class="fa-solid fa-circle-info text-discord-blurple"></i> ${escapeHtml(message)}`;
            container.appendChild(toast);

            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-4', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }
    </script>
</body>
</html>
